[global]
    server role = standalone server
    security = user
    workgroup = WORKGROUP
    passdb backend = tdbsam
    server min protocol = SMB2_02
    server max protocol = SMB3_11
    server signing = mandatory
    server smb encrypt = if_required
    ntlm auth = ntlmv2-only
    map to guest = Never
    restrict anonymous = 2
    smb ports = 1445
    disable netbios = yes
    multicast dns register = no
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    wide links = no
    follow symlinks = no
    access based share enum = yes
    max smbd processes = 32
    log file = /dev/stderr
    logging = file
    log level = 0

[omega-compat]
    path = /srv/omega-smb/compat
    valid users = omega-compat
    guest ok = no
    read only = no
    server smb encrypt = if_required
    create mask = 0600
    directory mask = 0700

[omega-secure]
    path = /srv/omega-smb/secure
    valid users = omega-secure
    guest ok = no
    read only = no
    server smb encrypt = required
    create mask = 0600
    directory mask = 0700

[omega-models]
    path = /srv/omega-smb/models
    valid users = omega-secure
    guest ok = no
    read only = yes
    server smb encrypt = required
